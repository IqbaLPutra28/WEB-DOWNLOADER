<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Video Downloader - Download video dari YouTube, TikTok, Instagram">
    <title>Video Downloader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📹 Video Downloader</h1>
        <p class="subtitle">Download video dari YouTube, TikTok, Instagram, Twitter</p>
        
        <div class="input-group">
            <input 
                type="text" 
                id="url" 
                placeholder="Masukkan link video..." 
                autocomplete="off"
            >
            <button onclick="cekResolusi()" id="checkBtn">Cek Resolusi</button>
        </div>

        <div id="loading" style="display:none; text-align: center;">
            <div class="spinner"></div>
            <p>Sedang menganalisis video...</p>
        </div>

        <div id="error" style="display:none; margin-top: 20px;" class="error-box">
            <p id="errorMsg"></p>
        </div>

        <div id="result" style="display:none; margin-top: 20px;">
            <img id="thumb" src="" alt="Thumbnail" loading="lazy">
            <h3 id="title"></h3>
            <p class="duration" id="duration"></p>
            
            <label for="resSelect">Pilih kualitas:</label>
            <select id="resSelect"></select>
            
            <button onclick="downloadVideo()" class="download-btn">
                ⬇️ Download Sekarang
            </button>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000'; // Ubah ke domain asli saat deploy
        
        async function cekResolusi() {
            const url = document.getElementById('url').value.trim();
            const errorBox = document.getElementById('error');
            const resultBox = document.getElementById('result');
            const loadingBox = document.getElementById('loading');
            
            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            
            if (!url) {
                showError('Masukkan URL video terlebih dahulu');
                return;
            }
            
            loadingBox.style.display = 'block';
            const checkBtn = document.getElementById('checkBtn');
            checkBtn.disabled = true;
            
            try {
                const res = await fetch(`${API_URL}/api/formats`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                
                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.detail || 'Gagal mengambil format video');
                }
                
                const data = await res.json();
                
                if (!data.formats || data.formats.length === 0) {
                    throw new Error('Tidak ada format video yang tersedia');
                }
                
                document.getElementById('title').innerText = data.title;
                document.getElementById('thumb').src = data.thumb;
                
                const duration = data.duration;
                if (duration) {
                    const mins = Math.floor(duration / 60);
                    document.getElementById('duration').innerText = `Durasi: ${mins} menit`;
                }
                
                const select = document.getElementById('resSelect');
                select.innerHTML = data.formats.map(f => {
                    const size = f.size ? ` (${formatBytes(f.size)})` : '';
                    return `<option value="${f.format_id}">${f.res}${size}</option>`;
                }).join('');
                
                resultBox.style.display = 'block';
                loadingBox.style.display = 'none';
            } catch (err) {
                showError(err.message);
                loadingBox.style.display = 'none';
            } finally {
                checkBtn.disabled = false;
            }
        }

        async function downloadVideo() {
            const btn = document.querySelector('.download-btn');
            const url = document.getElementById('url').value;
            const format_id = document.getElementById('resSelect').value;
            
            btn.innerText = "⏳ Sedang Mengunduh...";
            btn.disabled = true;
            
            try {
                const res = await fetch(`${API_URL}/api/download`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url, format_id: format_id})
                });
                
                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.detail || 'Download gagal');
                }
                
                const data = await res.json();
                btn.innerText = "✅ Download Selesai";
                
                // Trigger download
                setTimeout(() => {
                    window.location.href = `${API_URL}/api/get-file/${encodeURIComponent(data.filename)}`;
                    btn.innerText = "⬇️ Download Sekarang";
                    btn.disabled = false;
                }, 1500);
            } catch (err) {
                showError(err.message);
                btn.innerText = "⬇️ Download Sekarang";
                btn.disabled = false;
            }
        }
        
        function showError(message) {
            const errorBox = document.getElementById('error');
            document.getElementById('errorMsg').innerText = message;
            errorBox.style.display = 'block';
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        // Enter key support
        document.getElementById('url').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') cekResolusi();
        });
    </script>
</body>
</html>
